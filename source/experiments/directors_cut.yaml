# Portable reference configuration for the eight-candidate fog audition.
# Authors: Alicia Chua, Pawarit Laosunthara, and Eric Tang, Anyscale.
# Run from the teaching package root if using the companion cosmos_ray runner.
# The source clip is bundled at interactive/media/source.mp4.

name: directors_cut
output_dir: generated/directors_cut
model: edge/distilled

base:
  video_path: interactive/media/source.mp4
  num_steps: 4
  guidance: 4
  max_frames: 93
  prompt: >-
    The video is a driving scene through a modern urban environment,
    captured from a dashcam inside a vehicle. The scene unfolds on a
    wide multi-lane road flanked by tall modern buildings with glass
    facades. A black car travels directly ahead. Trees and pedestrians
    line the sidewalks, and traffic cones guide vehicles on the road.
    Moderate fog fills the street: nearby vehicles and road markings
    remain clearly visible, while distant buildings are softened,
    their colours muted and their edges indistinct.
  controls:
    - kind: edge
      weight: 0.65

axes:
  take:
    - tag: take01
      seed: 2025
    - tag: take02
      seed: 7319
    - tag: take03
      seed: 18427
    - tag: take04
      seed: 29063
    - tag: take05
      seed: 41851
    - tag: take06
      seed: 57203
    - tag: take07
      seed: 70439
    - tag: take08
      seed: 91873
